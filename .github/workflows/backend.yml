name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
      - .github/scripts/deploy.sh
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
      - .github/scripts/deploy.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config
      - run: cargo fmt --all --check
        working-directory: backend
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: backend
      - run: cargo test --locked
        working-directory: backend
      - run: cargo build --release --locked
        working-directory: backend
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/ethos-adamas/tacitus-be:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v6
      - run: .github/scripts/deploy.sh backend "$GITHUB_SHA"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
