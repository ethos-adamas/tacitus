[package]
name = "tacitus-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
rand = "0.9"
sequoia-openpgp = { version = "2.4.1", default-features = false, features = ["crypto-openssl", "compression-deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
