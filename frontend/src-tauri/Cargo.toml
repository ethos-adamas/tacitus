[package]
name = "tacitus-mobile"
version = "1.3.0"
description = "Tacitus mobile client"
authors = ["ethos-adamas"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tacitus_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3" }
tauri-plugin-identity = { path = "plugins/identity" }
tauri-plugin-notification = "2.3.3"
